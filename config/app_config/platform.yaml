robot:
  name: SPARQ

robots:
  SPARQ:
    model_path: third_party/mujoco/model/SPARQ/sparq_environment.xml
    policy_config_dir: config/policy_config/SPARQ
    pd_config_path: config/policy_config/SPARQ/SPARQ/pd_config.yaml
    
can:
  interface: vcan0
  bitrate: 1000000
  daemon_socket: /tmp/qhrr_can_daemon.sock

shm:
  mit_command: qhrr_mit_command
  aux_command: qhrr_aux_command
  operator_command: qhrr_operator_command
  control_state: qhrr_control_state
  dashboard_state: qhrr_dashboard_state

imu:
  type: e2box
  request_id: 0x221
  quat_id: 0x2A1
  gyro_id: 0x321
  cmd_get_quat: 0x01
  cmd_get_gyro: 0x02
  cmd_get_all: 0x03
  quat_scale: 10000.0
  gyro_scale: 100.0
  normalize_quat: true

spg_mit:
  p_max_rad: 12.5
  v_max_rad_s: 45.0
  kp_max: 500.0
  kd_max: 5.0
  tau_max_nm: 33.0
  feedback_position_max_rad: 12.56
  iq_full_scale_count: 2048.0
  iq_full_scale_current_a: 33.0

actuators:
  - name: FL_HR
    enabled: true
    can_id: 0x1
    mujoco_joint: FL_HR
    mujoco_actuator: FL_HR_motor
    sign: 1.0
    offset_rad: 0.0

  - name: FL_HP
    enabled: true
    can_id: 0x02
    mujoco_joint: FL_HP
    mujoco_actuator: FL_HP_motor
    sign: 1.0
    offset_rad: 0.0

  - name: FL_KP
    enabled: true
    can_id: 0x03
    mujoco_joint: FL_KP
    mujoco_actuator: FL_KP_motor
    sign: 1.0
    offset_rad: 0.0


  - name: FR_HR
    enabled: true
    can_id: 0x21
    mujoco_joint: FR_HR
    mujoco_actuator: FR_HR_motor
    sign: 1.0
    offset_rad: 0.0
    
  - name: FR_HP 
    enabled: true
    can_id: 0x22
    mujoco_joint: FR_HP
    mujoco_actuator: FR_HP_motor
    sign: 1.0
    offset_rad: 0.0

  - name: FR_KP
    enabled: true
    can_id: 0x23
    mujoco_joint: FR_KP
    mujoco_actuator: FR_KP_motor
    sign: 1.0
    offset_rad: 0.0


  - name: RL_HR
    enabled: true
    can_id: 0x11
    mujoco_joint: RL_HR
    mujoco_actuator: RL_HR_motor
    sign: 1.0
    offset_rad: 0.0

  - name: RL_HP
    enabled: true
    can_id: 0x12
    mujoco_joint: RL_HP
    mujoco_actuator: RL_HP_motor
    sign: 1.0
    offset_rad: 0.0

  - name: RL_KP
    enabled: true
    can_id: 0x13
    mujoco_joint: RL_KP
    mujoco_actuator: RL_KP_motor
    sign: 1.0
    offset_rad: 0.0


  - name: RR_HR
    enabled: true
    can_id: 0x31
    mujoco_joint: RR_HR
    mujoco_actuator: RR_HR_motor
    sign: 1.0
    offset_rad: 0.0

  - name: RR_HP
    enabled: true
    can_id: 0x32
    mujoco_joint: RR_HP
    mujoco_actuator: RR_HP_motor
    sign: 1.0
    offset_rad: 0.0
    
  - name: RR_KP
    enabled: true
    can_id: 0x33
    mujoco_joint: RR_KP
    mujoco_actuator: RR_KP_motor
    sign: 1.0
    offset_rad: 0.0

