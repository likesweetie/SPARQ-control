platform_config: platform.yaml
robot_controller_config: robot_controller.yaml

dashboard:
  host: 127.0.0.1
  port: 8000
  state_hz: 24
  transmit_ids:
    - label: RL hip roll
      actuator: RL_HR
      payload: "C100000000000000"
    - label: RL hip pitch
      actuator: RL_HP
      payload: "C100000000000000"
    - label: RL knee pitch
      actuator: RL_KP
      payload: "C100000000000000"
  zero_set_presets:
    - id: qhrr
      label: Hip Roll 82.5 / Hip Pitch -100 / Knee Pitch 20
      targets:
        - actuator: RL_HR
          offset_deg: 82.5
        - actuator: RL_HP
          offset_deg: -100.0
        - actuator: RL_KP
          offset_deg: 20.0

robot_controller_state:
  enabled: true
  stale_timeout_s: 0.5

can:
  display_channels:
    - name: CAN 0
      iface: vcan0
      bitrate: 1000000
    - name: CAN 1
      iface: vcan1
      bitrate: 1000000
    - name: CAN 2
      iface: vcan2
      bitrate: 1000000
    - name: CAN 3
      iface: vcan3
      bitrate: 1000000
  bus_window_s: 1.0
  heartbeat_window_s: 1.0
  node_timeout_s: 0.25
  stuff_factor: 1.15

can_daemon:
  connect_timeout_s: 1.0

spg:
  default_mit_poll_hz: 500

safety:
  tx_enabled_by_default: false
  allow_actuator_commands: true
